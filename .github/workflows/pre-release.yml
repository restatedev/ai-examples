name: Pre-release updates

on:
  workflow_dispatch:
    inputs:
      sdkTypescriptVersion:
        description: "sdk-typescript version (without prepending v). Leave empty if you do not want to update it."
        required: false
        type: string
      agentlibVersion:
        description: "agentlib version (without prepending v). Leave empty if you do not want to update it."
        required: false
        type: string
      sdkPythonVersion:
        description: "sdk-python version (without prepending v). Leave empty if you do not want to update it."
        required: false
        type: string

jobs:
  updates:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESTATE_DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v3.7.0


      # Bump TypeScript SDK and agentlib
      - uses: actions/setup-node@v3.9.1
        if: inputs.sdkTypescriptVersion != '' || inputs.agentlibVersion != ''
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      - name: Bump sdk-typescript
        if: github.event.inputs.sdkTypescriptVersion != ''
        env:
          SDK_TYPESCRIPT_VERSION: ${{ inputs.sdkTypescriptVersion }}
        run: ./.tools/update_node_examples.sh "$SDK_TYPESCRIPT_VERSION"
      - name: Bump agentlib
        if: inputs.agentlibVersion != ''
        env:
          AGENTLIB_VERSION: ${{ inputs.agentlibVersion }}
        run: ./.tools/update_agentlib_examples.sh "$AGENTLIB_VERSION"
      - name: Run Node tests
        if: inputs.sdkTypescriptVersion != '' || inputs.agentlibVersion != ''
        run: ./.tools/run_node_tests.sh

      # Bump Python SDK
      - uses: actions/setup-python@v5.6.0
        if: github.event.inputs.sdkPythonVersion != ''
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4.2.0
      - name: Bump Python SDK
        if: github.event.inputs.sdkPythonVersion != ''
        run: ./.tools/update_python_examples.sh ${{ inputs.sdkPythonVersion }}
      - name: Run Python tests
        if: github.event.inputs.sdkPythonVersion != ''
        run: ./.tools/run_python_tests.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5.0.3
        with:
          title: "[GithubActions] Update ${{ inputs.sdkTypescriptVersion != '' && format('SDK-Typescript {0} ', inputs.sdkTypescriptVersion) }}${{ inputs.agentlibVersion != '' && format('agentlib {0} ', inputs.agentlibVersion) }}${{ inputs.sdkPythonVersion != '' && format('SDK-Python {0} ', inputs.sdkPythonVersion) }}"
          commit-message: "[GithubActions] Update ${{ inputs.sdkTypescriptVersion != '' && format('SDK-Typescript {0} ', inputs.sdkTypescriptVersion) }}${{ inputs.agentlibVersion != '' && format('agentlib {0} ', inputs.agentlibVersion) }}${{ inputs.sdkPythonVersion != '' && format('SDK-Python {0} ', inputs.sdkPythonVersion) }}"
          add-paths: |
            **/package.json
            **/package-lock.json
            **/pyproject.toml
