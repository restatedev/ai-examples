[project]
name = "agents"
version = "0.1.0"
description = "Python template using Restate with Pydantic AI"
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "hypercorn",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.17.0",
    "restate-sdk[serde]>=1.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]
